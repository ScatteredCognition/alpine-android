# ==============================================================================
# alpine.conf - Configuration for Alpine Linux (edge rolling)
# ==============================================================================

DISTRO_NAME="alpine"
DISTRO_DESCRIPTION="Alpine Linux (edge rolling aarch64)"

# Path to rootfs directory
ROOTFS_PATH="/data/chroot/alpine"

# Shell resolution hierarchy (checked in order, must end with fallback /bin/sh)
DEFAULT_SHELLS="/usr/bin/fish /bin/bash /bin/sh"

# Public DNS resolvers
DNS_SERVERS="1.1.1.1 8.8.8.8"

# Filesystem mount toggles
ENABLE_CORE_MOUNTS=1
ENABLE_SHM=1
ENABLE_DEVPTS=1
ENABLE_STORAGE_MOUNTS=1

# Optional extra custom bind mounts: format "HOST_PATH:CHROOT_TARGET" separated by spaces
EXTRA_MOUNTS=""

# Clean environment variables supplied to chroot session
ENV_HOME="/root"
ENV_TERM="xterm-256color"
ENV_PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
